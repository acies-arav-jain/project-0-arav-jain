[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "project-0"
version = "0.1.0"
description = "Document cleaning and ingestion CLI"
requires-python = ">=3.11"
dependencies = [
    "emoji>=2.0",
    "pydantic"
]


[project.scripts]
chunker = "app.cli:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]