[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "project-0"
version = "0.1.0"
description = "Document cleaning and ingestion CLI"
requires-python = ">=3.11"


[project.scripts]
cli = "app.cli:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]